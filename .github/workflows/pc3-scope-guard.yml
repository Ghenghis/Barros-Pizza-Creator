name: PC3 scope guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce PC3-only repository scope and identity
        run: python scripts/check_pc3_scope.py

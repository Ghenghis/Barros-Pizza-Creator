name: Operator recovery tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ecosystem audit tools
        run: |
          python -m py_compile tools/verify_ecosystem_sync.py
          python -m py_compile tools/run_ecosystem_checks.py

  powershell-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse operator PowerShell without executing remotes
        shell: powershell
        run: |
          $files = @('scripts/Sync-GitLabSafe.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

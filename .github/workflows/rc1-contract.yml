name: RC1 proof contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend and contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate locked and ecosystem JSON
        run: |
          python -m json.tool contracts/rc1.acceptance.json >/dev/null
          python -m json.tool contracts/ecosystem.acceptance.json >/dev/null
          python -m json.tool contracts/pc3-image-handoff.schema.json >/dev/null
          python -m json.tool contracts/pc3-build-compatibility.json >/dev/null
          python -m json.tool artifacts/build-provenance.json >/dev/null
      - name: Build and verify deterministic release twice
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release.py --output releases/ci-contract.zip
          first="$(sha256sum releases/ci-contract.zip | awk '{print $1}')"
          cp releases/ci-contract.zip /tmp/ci-contract-first.zip
          python tools/build_release.py --output releases/ci-contract.zip
          second="$(sha256sum releases/ci-contract.zip | awk '{print $1}')"
          test "$first" = "$second"
          cmp /tmp/ci-contract-first.zip releases/ci-contract.zip
          python tools/build_release.py --verify-only --output releases/ci-contract.zip
          echo "Deterministic release SHA-256: $second"

  windows-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static proof harness
        shell: powershell
        run: .\scripts\Invoke-ProofContract.ps1 -Stage Static

# Proprietary PC3 assemblies are intentionally absent from public CI.
# BLD-101/102/104 and all live gates run only against the user's exact Creator 0.11.272 game installation.

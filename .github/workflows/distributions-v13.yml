name: Creator 1.3 distributions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'plugin-src/**'
      - 'packaging/**'
      - 'tools/**'
      - 'tests/**'
      - 'VERSION.txt'

jobs:
  portable-tests-and-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_vps_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: creator-vps-headless
          path: |
            releases/*VPS_Headless.zip
            releases/*VPS_Headless.zip.sha256

  windows-package-recipes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py
      - run: python tools/build_vps_bundle.py
      - name: Build Inno installer when available
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 not available on runner' }
          & $iscc packaging\CreatorInstaller.iss
      - uses: actions/upload-artifact@v4
        with:
          name: creator-windows-packages
          path: |
            releases/*.zip
            releases/*.zip.sha256
            releases/*Setup.exe

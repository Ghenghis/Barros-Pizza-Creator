plugins { id "com.android.application" }

def signingFile = System.getenv("BARROS_ANDROID_KEYSTORE")
def signingPassword = System.getenv("BARROS_ANDROID_KEYSTORE_PASSWORD")
def signingAlias = System.getenv("BARROS_ANDROID_KEY_ALIAS") ?: "barros-mobile"
def mobileVersion = System.getenv("BARROS_MOBILE_VERSION") ?: "1.0.1"
def mobileVersionParts = mobileVersion.tokenize(".").collect { it as int }
def mobileVersionCode = (mobileVersionParts[0] * 10000) + (mobileVersionParts[1] * 100) + mobileVersionParts[2]

android {
    namespace "tech.daveai.barroscreator"
    compileSdk 35

    defaultConfig {
        applicationId "tech.daveai.barroscreator"
        minSdk 26
        targetSdk 35
        versionCode mobileVersionCode
        versionName mobileVersion
    }

    if (signingFile && signingPassword) {
        signingConfigs {
            release {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingFile && signingPassword) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix ".debug" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
